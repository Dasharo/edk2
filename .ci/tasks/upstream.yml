version: '3'

vars:
  REPO_ROOT:
    sh: git rev-parse --show-toplevel

tasks:
  pull:
    desc: Pull&Push upstream master to the mirror
    dir: '{{.REPO_ROOT}}'
    requires:
      vars: [GITEA_TOKEN, CI_REPO]
    cmds:
      - |
        set -euo pipefail
        git fetch --no-tags https://github.com/tianocore/edk2.git \
          +master:refs/upstream/master \
          '+refs/tags/*:refs/upstream-tags/*'
        push_url="https://ci:${GITEA_TOKEN}@git.3mdeb.com/${CI_REPO}.git"
        git push --atomic "$push_url" \
          refs/upstream/master:refs/heads/master \
          'refs/upstream-tags/*:refs/tags/*'
